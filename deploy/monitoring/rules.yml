groups:
  - name: homebrew-mlflow
    rules:
      - alert: HomebrewMlflowApiDown
        expr: up{job="homebrew-mlflow-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Homebrew MLflow API is unavailable
      - alert: HomebrewMlflowHighServerErrorRate
        expr: |
          sum(rate(homebrew_mlflow_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(homebrew_mlflow_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of platform requests return server errors
