[project]
name = "homebrew-mlflow-infrastructure"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "boto3>=1.42,<2",
  "homebrew-mlflow-application",
  "homebrew-mlflow-domain",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homebrew_mlflow"]
