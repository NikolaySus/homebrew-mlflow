[project]
name = "homebrew-mlflow"
version = "0.1.1"
description = "Credential and local-run helper for Homebrew MLflow"
requires-python = ">=3.11"
dependencies = [
  "homebrew-mlflow-contracts",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "packaging>=24,<26",
  "typer>=0.15,<1",
]

[project.scripts]
homebrew-mlflow = "homebrew_mlflow.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homebrew_mlflow"]

[tool.uv.sources]
homebrew-mlflow-contracts = { workspace = true }
