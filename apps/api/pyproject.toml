[project]
name = "homebrew-mlflow-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "homebrew-mlflow-application",
  "homebrew-mlflow-contracts",
  "homebrew-mlflow-domain",
  "homebrew-mlflow-infrastructure",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
homebrew-mlflow-api = "homebrew_mlflow.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homebrew_mlflow"]

[tool.uv.sources]
homebrew-mlflow-application = { workspace = true }
homebrew-mlflow-contracts = { workspace = true }
homebrew-mlflow-domain = { workspace = true }
homebrew-mlflow-infrastructure = { workspace = true }
