[project]
name = "homebrew-mlflow-plugins"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mlflow==3.15.1",
  "requests>=2.32,<3",
]

[project.entry-points."mlflow.tracking_store"]
homebrew = "homebrew_mlflow.mlflow_plugins.tracking_entrypoint:build_tracking_store"

[project.entry-points."mlflow.run_context_provider"]
homebrew_mlflow = "homebrew_mlflow.mlflow_plugins.run_context:HomebrewRunContextProvider"

[project.entry-points."mlflow.artifact_repository"]
homebrew = "homebrew_mlflow.mlflow_plugins.artifact_entrypoint:build_artifact_repository"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homebrew_mlflow"]
