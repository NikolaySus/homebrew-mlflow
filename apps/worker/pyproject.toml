[project]
name = "homebrew-mlflow-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["homebrew-mlflow-application", "homebrew-mlflow-infrastructure"]

[project.scripts]
homebrew-mlflow-worker = "homebrew_mlflow.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homebrew_mlflow"]

[tool.uv.sources]
homebrew-mlflow-application = { workspace = true }
homebrew-mlflow-infrastructure = { workspace = true }
