name: compose-acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  real-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: mkdir -p build/packages
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: docker compose -f deploy/compose/compose.yaml up -d --build
      - run: uv run python scripts/compose_acceptance.py
      - name: Capture service status and failing logs
        if: failure()
        run: |
          docker compose -f deploy/compose/compose.yaml ps -a
          docker compose -f deploy/compose/compose.yaml logs --tail=200 api migrate gitlab-bootstrap infisical-bootstrap publication-worker-1 publication-worker-2
      - name: Remove acceptance stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes --remove-orphans
