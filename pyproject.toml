[project]
name = "homebrew-mlflow-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "dvc[s3]==3.67.1",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/mlflow_plugins",
  "apps/worker",
  "packages/application",
  "packages/cli",
  "packages/contracts",
  "packages/domain",
  "packages/infrastructure",
]

[tool.uv.sources]
homebrew-mlflow-api = { workspace = true }
homebrew-mlflow-application = { workspace = true }
homebrew-mlflow-contracts = { workspace = true }
homebrew-mlflow-domain = { workspace = true }
homebrew-mlflow-infrastructure = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["homebrew_mlflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
